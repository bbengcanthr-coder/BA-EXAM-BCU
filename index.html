<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อสอบกลางภาค คณะบริหารธุรกิจ มหาวิทยาลัยเบงจันทร์ ปีการศึกษา 2569</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #002147; /* สีกรมท่า */
            --bg-color: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --success-color: #28a745;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
        }

        .header p {
            margin: 0;
            font-size: 1rem;
            font-weight: 300;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Sarabun', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #001530;
        }

        .exam-section {
            display: none;
            margin-top: 30px;
        }

        .subject-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-top: 40px;
        }

        .question-block {
            background: #f9f9f9;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 15px;
        }

        .options label {
            display: block;
            font-weight: normal;
            color: var(--text-color);
            padding: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .options input[type="radio"] {
            margin-right: 10px;
        }

        .result-section {
            display: none;
            text-align: center;
        }

        .grade-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .grade-table th, .grade-table td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
        }

        .grade-table th {
            background-color: var(--primary-color);
            color: white;
        }

        .gpa-result {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 20px;
            padding: 20px;
            background: #e8f0fe;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>ข้อสอบกลางภาค คณะบริหารธุรกิจ</h1>
        <p>มหาวิทยาลัยเบงจันทร์ ปีการศึกษา 2569</p>
    </div>

    <div class="container" id="student-info-section">
        <div class="form-group">
            <label for="studentName">ชื่อ-นามสกุล นักศึกษา</label>
            <input type="text" id="studentName" placeholder="กรุณากรอกชื่อ-นามสกุล" required>
        </div>
        <div class="form-group">
            <label for="studentMajor">สาขาวิชา</label>
            <select id="studentMajor">
                <option value="">-- เลือกสาขาวิชา --</option>
                <option value="management">สาขาวิชาการจัดการ</option>
                <option value="marketing">สาขาวิชาการตลาด</option>
                <option value="service">สาขาวิชาการจัดการธุรกิจบริการ</option>
            </select>
        </div>
        <div class="form-group">
            <label for="studentYear">ชั้นปี</label>
            <select id="studentYear">
                <option value="">-- เลือกชั้นปี --</option>
                <option value="year1">ปี 1 เทอม 1</option>
                <option value="year2">ปี 2 เทอม 1</option>
                <option value="year3">ปี 3 เทอม 1</option>
                <option value="year4">ปี 4 เทอม 1</option>
            </select>
        </div>
        <button onclick="startExam()">เริ่มทำข้อสอบ</button>
    </div>

    <div class="container exam-section" id="exam-section">
        <form id="exam-form">
            <div id="exam-container"></div>
            <button type="button" onclick="submitExam()" style="margin-top: 30px;">ส่งข้อสอบและประมวลผลเกรด</button>
        </form>
    </div>

    <div class="container result-section" id="result-section">
        <h2 style="color: var(--primary-color);">ผลการสอบและการประเมินเกรด</h2>
        <p id="result-student-name" style="font-size: 1.2rem; font-weight: bold;"></p>
        <table class="grade-table" id="grade-table">
            <thead>
                <tr>
                    <th>รายวิชา</th>
                    <th>คะแนน (เต็ม 10)</th>
                    <th>เกรด</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="gpa-result" id="gpa-result"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {

        const examData = {

                {

                    questions: [
                        { q: "1. ข้อใดคือเป้าหมายหลักของการจัดการ (Management)?", options: ["การสร้างผลกำไรสูงสุดเพียงอย่างเดียว", "การใช้ทรัพยากรให้เกิดประสิทธิภาพและประสิทธิผลสูงสุด", "การควบคุมพนักงานให้ทำงานหนักที่สุด", "การขยายขนาดองค์กรให้เร็วที่สุด"], answer: 1 },

                        { q: "4. การวิเคราะห์ SWOT ตัวอักษร 'O' ย่อมาจากอะไร?", options: ["Organization", "Opportunities", "Objectives", "Operations"], answer: 1 },
                        { q: "5. ผู้นำแบบใดที่เน้นการมีส่วนร่วมของพนักงานในการตัดสินใจ?", options: ["ผู้นำแบบเผด็จการ (Autocratic)", "ผู้นำแบบประชาธิปไตย (Democratic)", "ผู้นำแบบเสรีนิยม (Laissez-faire)", "ผู้นำแบบเจ้าระเบียบ (Bureaucratic)"], answer: 1 },
                        { q: "6. การแบ่งงานกันทำตามความถนัด (Division of Labor) สอดคล้องกับแนวคิดของใคร?", options: ["Adam Smith", "Elton Mayo", "Abraham Maslow", "Douglas McGregor"], answer: 0 },
                        { q: "7. ขั้นตอนแรกของกระบวนการควบคุม (Control Process) คืออะไร?", options: ["การแก้ไขข้อผิดพลาด", "การเปรียบเทียบผลงานกับมาตรฐาน", "การกำหนดมาตรฐานการทำงาน", "การวัดผลการปฏิบัติงาน"], answer: 2 },
                        { q: "8. สายการบังคับบัญชา (Chain of Command) หมายถึงอะไร?", options: ["จำนวนลูกน้องที่ผู้บริหารดูแล", "เส้นทางการรายงานจากระดับสูงลงสู่ระดับล่าง", "การแบ่งแผนกงานตามภูมิภาค", "การกระจายอำนาจให้พนักงาน"], answer: 1 },
                        { q: "9. ทฤษฎีความต้องการ 5 ขั้น เป็นผลงานของใคร?", options: ["Frederick Taylor", "Henri Fayol", "Abraham Maslow", "Max Weber"], answer: 2 },

                        { q: "1. ความคิดสร้างสรรค์ในธุรกิจบริการหมายถึงอะไร?", options: ["การสร้างวิธีการบริการใหม่ที่เพิ่มคุณค่าให้ลูกค้าได้จริง", "การเล่นมุกตลก", "การทำลายข้าวของ", "การไม่มีกฎระเบียบ"], answer: 0 },
                        { q: "2. เทคนิคการระดมสมองช่วยอย่างไร?", options: ["กระตุ้นให้เกิดแนวคิดใหม่ที่หลากหลาย", "ทำให้งง", "เสียเวลา", "ปิดกั้นความคิด"], answer: 0 },
                        { q: "3. ทำไมต้องส่งเสริมความคิดสร้างสรรค์ในองค์กรบริการ?", options: ["เพื่อให้ทันคู่แข่งและสร้างโอกาสใหม่เสมอ", "เพื่อเล่นสนุก", "เพื่อให้งานช้าลง", "ไม่มีเหตุผล"], answer: 0 },
                        { q: "4. อะไรคืออุปสรรคที่ใหญ่ที่สุดของความคิดสร้างสรรค์?", options: ["ความกลัวความล้มเหลวและการยึดติดรูปแบบเดิม", "การมีเงินเยอะ", "การทำงานเก่ง", "การตรงต่อเวลา"], answer: 0 },
                        { q: "5. เราจะนำความคิดสร้างสรรค์มาใช้ในธุรกิจบริการได้อย่างไร?", options: ["ปรับปรุงบริการให้แปลกใหม่และประทับใจยิ่งขึ้น", "ห้ามใช้", "เสียเวลา", "ลดราคา"], answer: 0 },
                        { q: "6. การคิดนอกกรอบ (Out of the box) ในงานบริการช่วยเรื่องใด?", options: ["การแก้ปัญหาที่ยากและคาดไม่ถึง", "การทำของเก่า", "การเลียนแบบ", "การหยุดทำ"], answer: 0 },
                        { q: "7. ทำไมความคิดสร้างสรรค์ต้องมาคู่กับการทำได้จริง (Feasibility)?", options: ["เพื่อนำไปประยุกต์ใช้ได้ในทางธุรกิจ", "เพื่อความสนุก", "ไม่มีผล", "ทำให้เสียเวลา"], answer: 0 },
                        { q: "8. การฟังความเห็นจากลูกค้าช่วยเรื่องความคิดสร้างสรรค์อย่างไร?", options: ["เป็นแหล่งไอเดียในการพัฒนบริการใหม่ๆ", "ไม่เกี่ยว", "ทำให้เหนื่อย", "เสียเวลา"], answer: 0 },
                        { q: "9. ทำไมสภาพแวดล้อมที่ผ่อนคลายจึงเอื้อต่อความคิดสร้างสรรค์?", options: ["ลดความกดดันและเปิดโอกาสให้สมองได้คิดใหม่ๆ", "ไม่มีผล", "ทำให้พนักงานหลับ", "เปลืองงบ"], answer: 0 },
                        { q: "10. ผลลัพธ์สุดท้ายของธุรกิจที่เต็มไปด้วยความคิดสร้างสรรค์คืออะไร?", options: ["การเติบโตที่ยั่งยืนและชื่อเสียงที่เป็นเลิศ", "การขาดทุน", "ความวุ่นวาย", "ไม่มีอะไรเลย"], answer: 0 }
                    ]
                }
            ]
            // *** สำหรับชั้นปีและสาขาอื่นๆ คุณสามารถเพิ่มโครงสร้าง Array ข้อสอบแบบเดียวกันนี้ในรหัส marketing_year1, service_year1, management_year2 ฯลฯ ลงในออบเจ็กต์นี้ได้เลย ***
        };

        let currentExams = [];

        function startExam() {
            const name = document.getElementById('studentName').value;
            const major = document.getElementById('studentMajor').value;
            const year = document.getElementById('studentYear').value;

            if(!name || !major || !year) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วนก่อนเริ่มทำข้อสอบ");
                return;
            }

            const dataKey = `${major}_${year}`;
            
            // ตรวจสอบว่ามีข้อมูลข้อสอบในระบบหรือไม่
            if(!examData[dataKey]) {
                alert("ระบบอยู่ระหว่างการอัปเดตข้อสอบสำหรับสาขาและชั้นปีที่เลือก กรุณาเลือก สาขาวิชาการจัดการ -> ปี 1 เทอม 1 เพื่อทดสอบระบบเต็มรูปแบบ");
                return;
            }

            currentExams = examData[dataKey];
            document.getElementById('student-info-section').style.display = 'none';
            document.getElementById('exam-section').style.display = 'block';

            renderExams();
            window.scrollTo(0, 0);
        }

        function renderExams() {
            const container = document.getElementById('exam-container');
            container.innerHTML = '';

            currentExams.forEach((exam, subjectIndex) => {
                const subjectHtml = `
                    <h2 class="subject-title">วิชา: ${exam.subject}</h2>
                    ${exam.questions.map((q, qIndex) => `
                        <div class="question-block">
                            <div class="question-text">${q.q}</div>
                            <div class="options">
                                ${q.options.map((opt, optIndex) => `
                                    <label>
                                        <input type="radio" name="q_${subjectIndex}_${qIndex}" value="${optIndex}" required>
                                        ${opt}
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                `;
                container.innerHTML += subjectHtml;
            });
        }

        function calculateGrade(score) {
            if (score >= 9) return { grade: 'A', point: 4.0 };
            if (score >= 8) return { grade: 'B+', point: 3.5 };
            if (score >= 7) return { grade: 'B', point: 3.0 };
            if (score >= 6) return { grade: 'C+', point: 2.5 };
            if (score >= 5) return { grade: 'C', point: 2.0 };
            if (score >= 4) return { grade: 'D+', point: 1.5 };
            if (score >= 3) return { grade: 'D', point: 1.0 };
            return { grade: 'F', point: 0.0 };
        }

        function submitExam() {
            const form = document.getElementById('exam-form');
            if(!form.checkValidity()) {
                alert("กรุณาตอบคำถามให้ครบทุกข้อในทุกวิชา");
                return;
            }

            let results = [];
            let totalPoints = 0;

            currentExams.forEach((exam, subjectIndex) => {
                let score = 0;
                exam.questions.forEach((q, qIndex) => {
                    const selected = document.querySelector(`input[name="q_${subjectIndex}_${qIndex}"]:checked`);
                    if(selected && parseInt(selected.value) === q.answer) {
                        score++;
                    }
                });

                const gradeInfo = calculateGrade(score);
                results.push({
                    subject: exam.subject,
                    score: score,
                    grade: gradeInfo.grade,
                    point: gradeInfo.point
                });
                totalPoints += gradeInfo.point;
            });

            const gpa = (totalPoints / currentExams.length).toFixed(2);
            
            saveToFirebase(results, gpa);
            displayResults(results, gpa);
        }

        function saveToFirebase(results, gpa) {
            const name = document.getElementById('studentName').value;
            const major = document.getElementById('studentMajor').value;
            const year = document.getElementById('studentYear').value;

            db.collection("exam_results").add({
                name: name,
                major: major,
                year: year,
                results: results,
                gpa: gpa,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                console.log("บันทึกข้อมูลสำเร็จ");
            }).catch((error) => {
                console.error("Error adding document: ", error);
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาตรวจสอบการตั้งค่า Firebase");
            });
        }

        function displayResults(results, gpa) {
            document.getElementById('exam-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            
            const name = document.getElementById('studentName').value;
            document.getElementById('result-student-name').innerText = `ชื่อผู้สอบ: ${name}`;

            const tbody = document.querySelector('#grade-table tbody');
            tbody.innerHTML = '';

            results.forEach(res => {
                tbody.innerHTML += `
                    <tr>
                        <td>${res.subject}</td>
                        <td>${res.score} / 10</td>
                        <td><strong>${res.grade}</strong></td>
                    </tr>
                `;
            });

            document.getElementById('gpa-result').innerText = `เกรดเฉลี่ยรวม (GPA): ${gpa}`;
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
